name: Release

# Cut a release from a tag. Building on a GitHub-hosted runner, signing the build
# provenance with Sigstore (SLSA Build L2), and publishing the zip + checksums means
# anyone can verify the download came from this exact source, with no Apple account
# involved. See docs/AUDIT.md for how to verify as a user.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build a release for, e.g. v1.1.0'
        required: true

permissions:
  contents: write       # create the release + upload assets
  id-token: write       # Sigstore OIDC, required by attest-build-provenance
  attestations: write   # write the build-provenance attestation to this repo

jobs:
  release:
    name: Build, attest, and publish
    runs-on: macos-latest
    steps:
      - name: Resolve tag and version
        id: ver
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - name: Security regression checks
        run: bash tests/security-regressions.sh

      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx -- "$TAG" >/dev/null \
            || { echo "::error::checkout is not the requested tag $TAG"; exit 1; }
          PLIST_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          PLIST_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
          [[ "$PLIST_SHORT_VERSION" = "$VERSION" && "$PLIST_BUILD_VERSION" = "$VERSION" ]] \
            || { echo "::error::Info.plist version does not match $TAG"; exit 1; }
          COMMIT_SHA="$(git rev-parse HEAD)"
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.verified')"
          [[ "$VERIFIED" = "true" ]] \
            || { echo "::error::tagged commit $COMMIT_SHA does not have a GitHub-verified signature"; exit 1; }

      - name: Toolchain
        run: |
          sw_vers
          swiftc --version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo n/a)"

      - name: Build Sleepless.app
        run: |
          set -euo pipefail
          # Conservative deployment target so it compiles against the runner SDK and
          # runs on macOS 13+. (Local + tested target is arm64-apple-macos26.0.)
          TARGET="arm64-apple-macos13.0" ./build.sh "$PWD/dist"
          codesign --verify --verbose=1 "dist/Sleepless.app"

      - name: Zip the app bundle
        id: zip
        run: |
          set -euo pipefail
          ASSET="Sleepless-${{ steps.ver.outputs.version }}.zip"
          ditto -c -k --keepParent "dist/Sleepless.app" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          ls -la "$ASSET"

      - name: SHA-256 checksums
        run: |
          set -euo pipefail
          shasum -a 256 "${{ steps.zip.outputs.asset }}" | tee SHA256SUMS

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.zip.outputs.asset }}

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > NOTES.md
          # Append verification footer.
          {
            echo ""
            echo "---"
            echo "### Verify this download"
            echo '```sh'
            echo "shasum -a 256 -c SHA256SUMS"
            echo "gh attestation verify ${{ steps.zip.outputs.asset }} -R ${{ github.repository }}"
            echo '```'
            echo "See [docs/AUDIT.md](https://github.com/${{ github.repository }}/blob/main/docs/AUDIT.md) for what each check proves."
          } >> NOTES.md
          echo "----- NOTES.md -----"; cat NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          ASSET="${{ steps.zip.outputs.asset }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; published assets are immutable"
            exit 1
          fi
          gh release create "$TAG" "$ASSET" SHA256SUMS \
            --title "Sleepless ${{ steps.ver.outputs.version }}" \
            --notes-file NOTES.md
